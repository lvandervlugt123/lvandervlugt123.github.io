<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tic Tac Toe Game</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        .container {
            text-align: center;
            background: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.3);
        }

        h1 {
            color: #333;
            margin-bottom: 10px;
            font-size: 2.5em;
        }

        .status {
            font-size: 1.2em;
            color: #667eea;
            margin-bottom: 20px;
            height: 30px;
            font-weight: bold;
        }

        .board {
            display: grid;
            grid-template-columns: repeat(3, 100px);
            gap: 10px;
            margin: 20px auto;
            background: #667eea;
            padding: 10px;
            border-radius: 10px;
        }

        .cell {
            width: 100px;
            height: 100px;
            background: white;
            border: none;
            border-radius: 8px;
            font-size: 2em;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
            color: #333;
        }

        .cell:hover:not(:disabled) {
            background: #f0f0f0;
            transform: scale(1.05);
        }

        .cell:disabled {
            cursor: not-allowed;
        }

        .cell.x {
            color: #667eea;
        }

        .cell.o {
            color: #764ba2;
        }

        button {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 12px 30px;
            font-size: 1.1em;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-top: 20px;
            font-weight: bold;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
        }

        .info {
            margin-top: 20px;
            color: #666;
            font-size: 0.95em;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Tic Tac Toe</h1>
        <div class="status" id="status">Your turn (X)</div>
        <div class="board" id="board">
            <button class="cell" data-index="0"></button>
            <button class="cell" data-index="1"></button>
            <button class="cell" data-index="2"></button>
            <button class="cell" data-index="3"></button>
            <button class="cell" data-index="4"></button>
            <button class="cell" data-index="5"></button>
            <button class="cell" data-index="6"></button>
            <button class="cell" data-index="7"></button>
            <button class="cell" data-index="8"></button>
        </div>
        <button onclick="resetGame()">New Game</button>
        <div class="info">
            <p>You are <strong>X</strong>, Computer is <strong>O</strong></p>
        </div>
    </div>

    <script>
        let gameBoard = ['', '', '', '', '', '', '', '', ''];
        let gameActive = true;
        const winningConditions = [
            [0, 1, 2],
            [3, 4, 5],
            [6, 7, 8],
            [0, 3, 6],
            [1, 4, 7],
            [2, 5, 8],
            [0, 4, 8],
            [2, 4, 6]
        ];

        const cells = document.querySelectorAll('.cell');
        const statusDisplay = document.getElementById('status');

        cells.forEach(cell => {
            cell.addEventListener('click', handleCellClick);
        });

        function handleCellClick(e) {
            const index = e.target.dataset.index;
            
            if (gameBoard[index] !== '' || !gameActive) return;

            gameBoard[index] = 'X';
            e.target.textContent = 'X';
            e.target.classList.add('x');
            e.target.disabled = true;

            if (checkWinner('X')) {
                statusDisplay.textContent = '🎉 You win!';
                gameActive = false;
                return;
            }

            if (isBoardFull()) {
                statusDisplay.textContent = "It's a draw!";
                gameActive = false;
                return;
            }

            statusDisplay.textContent = "Computer is thinking...";
            setTimeout(computerMove, 500);
        }

        function computerMove() {
            const availableSpots = gameBoard
                .map((val, idx) => val === '' ? idx : null)
                .filter(val => val !== null);

            if (availableSpots.length === 0) return;

            const bestMove = findBestMove(availableSpots);
            gameBoard[bestMove] = 'O';
            cells[bestMove].textContent = 'O';
            cells[bestMove].classList.add('o');
            cells[bestMove].disabled = true;

            if (checkWinner('O')) {
                statusDisplay.textContent = '🤖 Computer wins!';
                gameActive = false;
                return;
            }

            if (isBoardFull()) {
                statusDisplay.textContent = "It's a draw!";
                gameActive = false;
                return;
            }

            statusDisplay.textContent = 'Your turn (X)';
        }

        function findBestMove(availableSpots) {
            // Try to win
            for (let spot of availableSpots) {
                gameBoard[spot] = 'O';
                if (checkWinner('O')) {
                    gameBoard[spot] = '';
                    return spot;
                }
                gameBoard[spot] = '';
            }

            // Try to block player
            for (let spot of availableSpots) {
                gameBoard[spot] = 'X';
                if (checkWinner('X')) {
                    gameBoard[spot] = '';
                    return spot;
                }
                gameBoard[spot] = '';
            }

            // Prefer center
            if (availableSpots.includes(4)) return 4;

            // Prefer corners
            const corners = [0, 2, 6, 8].filter(i => availableSpots.includes(i));
            if (corners.length > 0) return corners[Math.floor(Math.random() * corners.length)];

            // Random available spot
            return availableSpots[Math.floor(Math.random() * availableSpots.length)];
        }

        function checkWinner(player) {
            return winningConditions.some(condition =>
                condition.every(index => gameBoard[index] === player)
            );
        }

        function isBoardFull() {
            return gameBoard.every(cell => cell !== '');
        }

        function resetGame() {
            gameBoard = ['', '', '', '', '', '', '', '', ''];
            gameActive = true;
            statusDisplay.textContent = 'Your turn (X)';
            cells.forEach(cell => {
                cell.textContent = '';
                cell.classList.remove('x', 'o');
                cell.disabled = false;
            });
        }
    </script>
</body>
</html>
